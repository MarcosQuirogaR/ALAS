[package]
name = "alas-opt"
description = "Design optimization: objective function, CG envelope checks, sampling, and differential evolution."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
alas-types = { path = "../alas-types" }
alas-config = { path = "../alas-config" }
alas-geom = { path = "../alas-geom" }
alas-atmo = { path = "../alas-atmo" }
alas-mass = { path = "../alas-mass" }
alas-struct = { path = "../alas-struct" }
alas-payload = { path = "../alas-payload" }
alas-perf = { path = "../alas-perf" }
alas-aero = { path = "../alas-aero" }
alas-prop = { path = "../alas-prop" }
alas-stab = { path = "../alas-stab" }
alas-math = { path = "../alas-math" }
alas-units = { path = "../alas-units" }
# One function: `route_cruise_altitude_m`, the rule that decides what altitude
# a configured route is actually flown at. The optimizer's sizing mission and
# the published mission have to agree about it, and a policy duplicated in two
# crates is exactly how they stopped agreeing.
alas-mission = { path = "../alas-mission" }
tracing = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
alas-testkit = { path = "../alas-testkit" }
serde_json = { workspace = true }

[lints]
workspace = true
