[package]
name = "alas-viz"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
alas-fonts = { path = "../alas-fonts" }
alas-report = { path = "../alas-report" }
# Scene text draws its sub- and superscripts from the one notation parser the
# SVG writer uses, so a vector view reads like the rendered figure.
alas-units = { path = "../alas-units" }
egui = { workspace = true }
resvg = { workspace = true }
tiny-skia = { workspace = true }
base64 = { workspace = true }
# The orthographic globe is projected pixel by pixel; the rows are independent
# and run on the rayon pool, which is what keeps an orbit frame under the
# display budget at desktop densities.
rayon = { workspace = true }

[dev-dependencies]
alas-config = { path = "../alas-config" }
alas-geom = { path = "../alas-geom" }
alas-pipeline = { path = "../alas-pipeline" }
serde_json = { workspace = true }

[lints]
workspace = true
