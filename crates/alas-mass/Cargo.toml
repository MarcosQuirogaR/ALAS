[package]
name = "alas-mass"
description = "Component mass estimation: FLOPS transport weight equations, the Torenbeek comparison buildup, item-level mass ledger, fuel plan and dispatch."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
# `torenbeek` takes the geometry crate's `Wing` and `Fuselage` directly.
alas-geom = { path = "../alas-geom" }
# `breakdown` reads `DesignRequirements`, `GeometryConfig` and `MassModelConfig`.
alas-config = { path = "../alas-config" }
# `wing_reconciliation` strength-sizes the primary box through the structural
# crate; `alas-struct` depends on config/exec/geom only, so this is acyclic.
alas-struct = { path = "../alas-struct" }
# The FLOPS equations and fuel policy are written in US customary units and
# convert through these ratios at every formula.
alas-units = { path = "../alas-units" }
thiserror = { workspace = true }

[dev-dependencies]
alas-testkit = { path = "../alas-testkit" }
serde = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
