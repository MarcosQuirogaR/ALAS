[package]
name = "alas-mass"
description = "Component mass estimation: Torenbeek's empirical wing and fuselage weight methods."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
# `mass_wing`/`mass_fuselage_simple` take native aerodynamic model's own `Wing`/`Fuselage`
# as their geometry arguments, exactly as upstream does.
alas-geom = { path = "../alas-geom" }
# `breakdown` reads `DesignRequirements`, `GeometryConfig` and
# `MassModelConfig` directly, exactly as `alas/physics/mass.py` does.
alas-config = { path = "../alas-config" }
# `wing_reconciliation` strength-sizes the primary box through the structural
# crate; `alas-struct` depends on config/exec/geom only, so this is acyclic.
alas-struct = { path = "../alas-struct" }
# `transport_weight`'s correlations are written in imperial units and convert
# through these ratios at every formula, exactly as the mission analysis model source does.
alas-units = { path = "../alas-units" }
thiserror = { workspace = true }

[dev-dependencies]
alas-testkit = { path = "../alas-testkit" }
serde = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
