[package]
name = "alas-perf"
description = "Field and point performance: landing gear sizing and performance estimates."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
# `size_landing_gear` reads a `LandingGearConfig` for its tire ladder, gear-count
# thresholds and turnover limit, exactly as `alas/physics/landing_gear.py` does.
alas-config = { path = "../alas-config" }
# The matching chart and V-speed schedule read the ambient state from
# `Atmosphere::new`, the fitted "differentiable" model, exactly as
# the performance physics does -- the
# same edge `alas-prop` carries for the same reason.
alas-atmo = { path = "../alas-atmo" }

[dev-dependencies]
alas-testkit = { path = "../alas-testkit" }
serde = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
