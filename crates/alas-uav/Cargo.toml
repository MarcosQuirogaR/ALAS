[package]
name = "alas-uav"
description = "Source-provenanced component selection and feasibility physics for fixed-wing electric UAVs."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
# Generated UAV geometry is converted into the production Airplane primitives
# before any shared aerodynamic model is invoked.
alas-geom = { path = "../alas-geom" }
# The adapter runs the established native aerodynamic model-parity VLM implementation; it
# does not duplicate or simplify that solver inside the UAV crate.
alas-aero = { path = "../alas-aero" }
# VLM operating points use the production atmosphere model at the user-set
# altitude rather than accepting an unrelated density approximation.
alas-atmo = { path = "../alas-atmo" }
# Component ids in the design tree refer to rows of the provenance-tracked
# component database; the database crate has no physics dependency.
alas-uav-db = { path = "../alas-uav-db" }
# Component records cross the scraper/reviewer boundary as stable typed JSON.
serde = { workspace = true }
serde_json = { workspace = true }
# Error types derive `Display` and `Error` the way the other library crates do.
thiserror = { workspace = true }
# Inflates deflated entries when a user imports a zip of propeller tables;
# already in the graph through the image stack, so it adds no new crate.
miniz_oxide = "0.8"

[lints]
workspace = true
