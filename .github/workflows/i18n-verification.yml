name: i18n verification

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  alas-i18n:
    name: alas-i18n on approved Linux runner
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install the repository Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.1

      - name: Execute the i18n regression suite
        run: cargo test -p alas-i18n
