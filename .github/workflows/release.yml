# Native builds for every supported platform.
#
# PyInstaller cannot cross-compile (docs/architecture.md §8): running
# `wails build -platform linux/amd64` on Windows still freezes a *Windows*
# sidecar. A Linux binary therefore needs a real Linux machine -- which is
# exactly what a matrix of native runners provides, and why this workflow is the
# only supported way to produce the Linux download.
#
# Triggers: a v* tag (attaches artifacts to the GitHub Release) or a manual
# run from the Actions tab (artifacts only, no release).

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # needed to create/attach to a Release

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # one platform failing must not discard the other's artifact
      matrix:
        include:
          # Asset names match what the public site already links to
          # (ALAS-site/src/components/Downloads.tsx points at this repo's
          # releases/latest/download/ALAS-windows.exe) -- renaming them
          # would break every existing download link.
          - os: windows-latest
            name: windows-amd64
            binary: ALAS.exe
            asset: ALAS-windows.exe
          - os: ubuntu-22.04 # oldest supported glibc -> widest compatibility
            name: linux-amd64
            binary: ALAS
            asset: ALAS-linux

    steps:
      - uses: actions/checkout@v4

      # Wails needs webkit2gtk headers on Linux; absent from the runner image.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # The sidecar is frozen with the project's own interpreter, and the SUAVE
      # runtime needs a separate 3.10 venv -- both provisioned through uv, the
      # same way the local build does it (scripts/prebuild.py).
      - uses: astral-sh/setup-uv@v5
      - name: Set up Python
        run: uv python install 3.13

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0

      - name: Build
        working-directory: desktop
        run: wails build -platform ${{ matrix.name == 'windows-amd64' && 'windows/amd64' || 'linux/amd64' }}

      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p dist
          cp "desktop/build/bin/${{ matrix.binary }}" "dist/${{ matrix.asset }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # ALAS-site/src/components/Downloads.tsx links to this repo's own
      # releases/latest/download/ALAS-windows.exe, so the default
      # repository-scoped GITHUB_TOKEN is enough -- no cross-repo PAT needed.
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          body_path: CHANGELOG.md
          draft: true # reviewed before it goes live
          generate_release_notes: false
