name: Workspace gate

# Tiers:
#   pull_request            quick gate on ubuntu: lint (repository checks, rustfmt,
#                           clippy -D warnings) and tests (nextest `default`
#                           profile) as two parallel jobs over the affected
#                           packages, plus the dependency policy check
#   push to main            full gate on windows (nextest `full` profile = fast +
#                           medium + integration tiers), plus the dependency
#                           policy check, plus a Linux cache seed for the PR tier
#   nightly + dispatch      the same full gate, then the nightly tier
#                           (`*_nightly` tests) on ubuntu
# Tags are not gated here: a release tag sits on a commit that already passed
# the push gate on main. Other branches are gated through their pull request.
#
# Branch protection (settings are NOT changed by this file): require
#   "Quick gate (pull request)", "Dependency licenses, advisories and sources"
#   and "Conventional Commits title" (pr-title.yml) on main.
# "Quick gate (pull request)" is the aggregate job below, so the check name is
# stable however many jobs the quick gate is split into. It is skipped, which
# GitHub counts as passing, outside pull requests, and it passes without
# running anything when a change touches only documentation or the site (see
# the `changes` job). That classification is a job rather than a workflow-level
# `paths-ignore` because a path-filtered workflow leaves a required check
# pending forever.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same PR supersedes the running quick gate. Pushes to main
# are never cancelled, so every main commit ends with a recorded result;
# nightly and manual runs are not cancelled either.
concurrency:
  group: gate-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # sccache keys on compiler input, so it cannot cache incremental artifacts,
  # and incremental state is dead weight in a cache that is restored cold.
  CARGO_INCREMENTAL: "0"
  # Cargo path packages fingerprint on file mtime, which a fresh checkout resets,
  # so unchanged workspace crates would rebuild on every run without sccache.
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"

jobs:
  changes:
    name: Classify the change
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Decide whether anything other than docs or the site changed
        id: classify
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          case "$EVENT" in
            pull_request) range="origin/${BASE_REF}...HEAD" ;;
            push)
              if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
                 && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
                range="$BEFORE..HEAD"
              else
                range=""
              fi ;;
            *) range="" ;;
          esac
          if [ -z "$range" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"; echo "no diff range: gate runs"; exit 0
          fi
          code=false
          while IFS= read -r f; do
            case "$f" in
              site/*) ;;
              .github/pages-redirect/*) ;;
              .github/ISSUE_TEMPLATE/*) ;;
              .github/CODEOWNERS) ;;
              .github/PULL_REQUEST_TEMPLATE.md) ;;
              .github/dependabot.yml) ;;
              .github/workflows/site-*.yml) ;;
              .github/workflows/pr-title.yml) ;;
              CITATION.cff|LICENSE|NOTICE) ;;
              docs/*.md) ;;
              */*) code=true ;;
              *.md) ;;
              *) code=true ;;
            esac
          done < <(git diff --name-only "$range")
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "changed files require the gate: $code"

  # The two halves of the quick gate share nothing but the source tree, so they
  # run as parallel jobs: clippy builds check artifacts, nextest builds test
  # binaries, and the wall time is the slower of the two instead of their sum.
  quick-lint:
    name: Quick gate - lint (checks, rustfmt, clippy)
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install the repository Rust toolchain
        uses: dtolnay/rust-toolchain@1.120.0
      - name: Install Linux system dependencies
        uses: ./.github/actions/linux-deps
      - name: Cache the compiler output
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      # v2.9.2. The key is fixed (not the job id) so the main-branch seed job
      # writes the entry the pull requests read. Only main writes: a pull
      # request restores main's cache but never competes with it for the 10 GB
      # repository quota.
      - name: Cache the dependency build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          prefix-key: quick-v1
          shared-key: lint
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Lint the packages the change affects
        env:
          BASE_REF: ${{ github.base_ref }}
        run: cargo xtask gate --quick --part lint --base "origin/${BASE_REF}"
      - name: Cache statistics
        if: always()
        run: sccache --show-stats

  quick-tests:
    name: Quick gate - tests (nextest default profile)
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install the repository Rust toolchain
        uses: dtolnay/rust-toolchain@1.120.0
      - name: Install Linux system dependencies
        uses: ./.github/actions/linux-deps
      - name: Cache the compiler output
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - name: Cache the dependency build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          prefix-key: quick-v1
          shared-key: tests
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install cargo-nextest for the test tiers
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      # The `default` profile: the fast tier. The medium, integration and
      # nightly tiers run on main and nightly.
      - name: Test the packages the change affects
        env:
          BASE_REF: ${{ github.base_ref }}
        run: cargo xtask gate --quick --part tests --base "origin/${BASE_REF}"
      - name: Cache statistics
        if: always()
        run: sccache --show-stats

  # The check to require on main. Always runs on a pull request so that a
  # failed, cancelled or skipped half can never read as a pass.
  quick-gate:
    name: Quick gate (pull request)
    needs: [changes, quick-lint, quick-tests]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Combine the quick gate results
        shell: bash
        env:
          CODE: ${{ needs.changes.outputs.code }}
          CHANGES: ${{ needs.changes.result }}
          LINT: ${{ needs.quick-lint.result }}
          TESTS: ${{ needs.quick-tests.result }}
        run: |
          set -euo pipefail
          echo "changes=$CHANGES code=$CODE lint=$LINT tests=$TESTS"
          [ "$CHANGES" = "success" ] || { echo "classification did not succeed"; exit 1; }
          if [ "$CODE" != "true" ]; then
            echo "documentation or site only: the quick gate does not apply"; exit 0
          fi
          [ "$LINT" = "success" ] && [ "$TESTS" = "success" ] || { echo "a quick gate half did not succeed"; exit 1; }

  # Runs on main and nightly: warms the caches the pull request jobs restore.
  # Pull-request caches are not readable across branches, so without a job on
  # the default branch every pull request would start cold.
  seed-quick-cache:
    name: Seed the quick gate caches (${{ matrix.part }})
    needs: changes
    if: github.event_name != 'pull_request' && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        part: [lint, tests]
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Install the repository Rust toolchain
        uses: dtolnay/rust-toolchain@1.120.0
      - name: Install Linux system dependencies
        uses: ./.github/actions/linux-deps
      - name: Cache the compiler output
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - name: Cache the dependency build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          prefix-key: quick-v1
          shared-key: ${{ matrix.part }}
      - name: Install cargo-nextest
        if: matrix.part == 'tests'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Build the lint artifacts
        if: matrix.part == 'lint'
        run: cargo clippy --workspace --all-targets
      - name: Build the test binaries
        if: matrix.part == 'tests'
        run: cargo nextest run --workspace --profile default --no-run
      - name: Cache statistics
        if: always()
        run: sccache --show-stats

  gate:
    name: Repository checks, formatting, clippy and workspace tests
    needs: changes
    if: github.event_name != 'pull_request' && needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      # Link test binaries with the toolchain's rust-lld: about twice as fast
      # as link.exe over the ~270 test binaries (measured locally). Release
      # packaging does not run here and keeps link.exe.
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER: rust-lld
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Install the repository Rust toolchain
        uses: dtolnay/rust-toolchain@1.120.0
      - name: Cache the compiler output
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - name: Cache the dependency build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          prefix-key: gate-v1
          shared-key: windows-full
      - name: Install cargo-nextest for the test tiers
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      # Repository checks, rustfmt, clippy -D warnings, then the `full` profile
      # (fast, medium and integration tiers; the nightly tests are excluded).
      - name: Execute the complete repository gate
        run: cargo xtask gate
      - name: Cache statistics
        if: always()
        run: sccache --show-stats

  nightly:
    name: Nightly tier (ubuntu)
    needs: changes
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Install the repository Rust toolchain
        uses: dtolnay/rust-toolchain@1.120.0
      - name: Install Linux system dependencies
        uses: ./.github/actions/linux-deps
      - name: Cache the compiler output
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - name: Cache the dependency build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          prefix-key: quick-v1
          shared-key: tests
          save-if: "false"
      - name: Install cargo-nextest for the test tiers
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Execute the nightly tier
        run: cargo xtask gate --nightly
      - name: Cache statistics
        if: always()
        run: sccache --show-stats

  dependencies:
    name: Dependency licenses, advisories and sources
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The cargo-deny container has no sccache; an empty wrapper disables the
    # workflow-level one so `cargo metadata` can run.
    env:
      RUSTC_WRAPPER: ""
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      # Licenses, bans and sources always block.
      - name: Check licenses, bans and sources
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          rust-version: "1.97.1"
          command: check bans licenses sources
          arguments: --locked

      # Advisories and yanked crates change with time rather than with the
      # diff, so they warn instead of blocking (a yanked crate once failed ~24
      # runs and as many emails in one day). Release packaging should run the
      # blocking form.
      - name: Check advisories and yanked crates (warning only)
        uses: EmbarkStudios/cargo-deny-action@v2
        continue-on-error: true
        with:
          rust-version: "1.97.1"
          command: check advisories
          arguments: --locked
