name: Site

# Builds the marketing site and the MkDocs documentation from site/ and
# publishes the combined output to GitHub Pages.
#
# This publishes the Pages mirror only. The live site at alas.uvigo.es is an
# Apache host at the university and is updated by a separate upload; nothing
# in this workflow reaches it.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/site-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

defaults:
  run:
    working-directory: site

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: site/docs-site/requirements.txt
      - run: pip install -r docs-site/requirements.txt
      - run: python -m mkdocs build --strict -f docs-site/mkdocs.yml
      - run: mkdir -p dist/docs && cp -r docs-site/site/. dist/docs/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
