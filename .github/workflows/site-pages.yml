name: Site

# Publishes a redirect-only GitHub Pages site. The ALAS site and its
# documentation live at https://alas.uvigo.es, an Apache host at the
# university updated by a separate upload; nothing in this workflow reaches
# it. Every Pages URL (marcosquirogar.github.io/ALAS/<path>) forwards to the
# same <path> on alas.uvigo.es. The site build itself is checked by
# site-ci.yml.

on:
  push:
    branches: [main]
    paths:
      - ".github/pages-redirect/**"
      - ".github/workflows/site-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p pages
          cp .github/pages-redirect/index.html pages/index.html
          cp .github/pages-redirect/index.html pages/404.html
          touch pages/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
