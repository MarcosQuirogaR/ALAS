name: Site CI

# Build and lint the site and documentation on every change under site/.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/site-ci.yml"
  pull_request:
    paths:
      - "site/**"
      - ".github/workflows/site-ci.yml"

permissions:
  contents: read

defaults:
  run:
    working-directory: site

jobs:
  frontend:
    name: build + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx oxlint

  docs:
    name: docs build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: site/docs-site/requirements.txt
      - run: pip install -r docs-site/requirements.txt
      - run: python -m mkdocs build --strict -f docs-site/mkdocs.yml
