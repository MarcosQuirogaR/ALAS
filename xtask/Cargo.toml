[package]
name = "xtask"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[dependencies]
# Parse source items and their spans to count textual includes and exclude only
# actual test items; a line grep can hide production items following tests.
syn = { workspace = true, features = ["visit"] }
proc-macro2 = { workspace = true, features = ["span-locations"] }

[lints.rust]
unsafe_code = "forbid"

# xtask is the one place that talks to a terminal by design: it is a developer
# command, never linked into the application.
[lints.clippy]
dbg_macro = "deny"
