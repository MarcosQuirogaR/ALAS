[project]
name = "alas"
version = "1.0.0"
description = "Aircraft Layout, Analysis and Sizing -- a conceptual aircraft design environment"
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE", "NOTICE", "THIRD-PARTY-NOTICES.md"]
authors = [{ name = "Marcos Quiroga Rodríguez" }]
keywords = [
    "aircraft-design",
    "conceptual-design",
    "aerodynamics",
    "aerospace",
    "optimization",
    "mdo",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]
dependencies = [
    "aerosandbox>=4.0",
    "numpy>=1.22",
    "scipy>=1.8",
    "matplotlib>=3.5",
    "pyyaml>=6.0",
    "pynastran>=1.4",
]

[project.optional-dependencies]
sidecar = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "websockets>=13",
    "pyvista>=0.43",
]
package = ["pyinstaller>=6.0", "pyinstaller-hooks-contrib>=2024.9"]

[project.urls]
Homepage = "https://github.com/MarcosQuirogaR/ALAS"
Source = "https://github.com/MarcosQuirogaR/ALAS"
Issues = "https://github.com/MarcosQuirogaR/ALAS/issues"

[project.scripts]
alas = "alas.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The vendored SUAVE tree ships its own regression suite, which targets an
# ancient numpy/scipy stack in a separate interpreter -- collecting it here
# would fail on import before any of this project's tests ran.
norecursedirs = ["external tools", ".venv", ".suave-venv", "desktop", "outputs"]

[tool.ruff]
# Vendored/third-party trees this project doesn't maintain -- linting them
# surfaces thousands of findings in code no PR here ever touches.
exclude = ["external tools", ".venv", ".suave-venv", "desktop", "outputs"]

[tool.ruff.lint]
# Pyflakes (real bugs: undefined names, unused imports) plus basic
# pycodestyle errors. The full rule catalogue also includes many stylistic
# and opinionated checks this project doesn't want gating a PR over
# CONTRIBUTING.md's numerical-review focus.
select = ["E4", "E7", "E9", "F"]

[tool.uv]
# pyNastran's own package metadata pins `numpy<2`, which would otherwise force
# uv's resolver to downgrade the whole project to numpy 1.26.4 -- a version with
# no prebuilt wheel for recent Python releases (forces a from-source build that
# needs a C++ compiler most machines don't have) and incompatible with
# aerosandbox's own numpy>=2 needs. The only thing that actually breaks at
# runtime against numpy 2.x is one renamed function pyNastran 1.4.x still calls
# (`np.in1d` -> `np.isin`), patched by `alas/integration/_nastran_compat.py`
# -- so it's safe to override pyNastran's own constraint and keep numpy 2.x.
override-dependencies = ["numpy>=2,<3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
