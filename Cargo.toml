[workspace]
resolver = "2"
members = ["crates/*", "xtask"]

[workspace.package]
version = "1.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
authors = ["Marcos Quiroga Rodriguez <marcos.quiroga.rodriguez@gmail.com>"]
rust-version = "1.85"

# Dependencies are declared here once so every crate resolves the same version.
# A new entry needs the justification described in CONTRIBUTING.md.
[workspace.dependencies]
# Build-only Windows SDK discovery and resource linking avoids bespoke toolchain plumbing.
winresource = { version = "0.1.31", default-features = false }
serde = { version = "1", features = ["derive"] }
# Direct DOM parsing keeps CPACS UID/reference validation separate from rendering.
roxmltree = "0.20"
# `float_roundtrip` is not optional here, it is what makes `exact` mean anything.
# serde_json's default float parser is fast but not always correctly rounded --
# its own documentation names the trade-off -- and a fixture value that lands one
# ulp from the double Python wrote is a reference the port cannot match no matter
# how right it is. Declared workspace-wide rather than per crate because the
# feature is unified across whatever happens to be in the build graph: with it on
# one crate's dev-dependencies, `cargo test --workspace` passed and
# `cargo test -p alas-struct` failed on the same code. It adds no crate to the
# graph; it only selects which parsing routine already inside serde_json runs.
serde_json = { version = "1", features = ["float_roundtrip"] }
serde_yaml = "0.9"
thiserror = "2"
tracing = "0.1"
egui = "0.29"
# WGPU keeps the native shell usable on Windows sessions that expose only the
# legacy OpenGL 1.1 compatibility context (the Glow painter requires OpenGL
# 2.0+).  The GUI's scene path is egui-image based, so it does not require the
# Glow-specific paint callback API.
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "wgpu", "x11", "wayland"] }
# Plotters is the common plotting API.  The GUI uses its drawing primitives
# through an egui-backed adapter, so figures do not cross the UI boundary as
# encoded SVG or raster buffers.
plotters = "0.3"
plotters-backend = "0.3"
resvg = "0.45"
tiny-skia = "0.11"

# Dense linear-algebra kernel. `alas-math::linalg` began as a scalar Gaussian
# elimination over row vectors. At the fine vortex-lattice mesh the product
# analysis runs (800 panels) that loop measured 164 ms per solve at about
# 2 Gflop/s on one core, was 90 % of every VLM call, and made the full
# analysis slower than the NumPy/LAPACK reference (4.3 s against 3.5 s,
# 2026-09-11). faer is a blocked, SIMD, multithreaded LU of LAPACK class in
# pure Rust, so `unsafe_code = "forbid"` still holds in every crate here.
# Default features are off: no sparse solvers, no random matrices, no `.npy`
# I/O -- only the dense factorizations and the rayon pool behind them.
faer = { version = "0.24", default-features = false, features = ["std", "linalg", "rayon"] }
# Data parallelism for numerical loops whose iterations are independent -- the
# vortex-lattice influence-matrix assembly first. Already in the graph through
# faer; declared here so a crate can use it directly.
rayon = "1"

# The three crates every procedural macro is written with. `alas-config-derive`
# is the only member that depends on them: a derive macro receives its input as
# a token stream and has to parse Rust syntax to do anything at all, and there
# is no standard-library facility for that.
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }

# The lint set is deliberately narrow. It encodes decisions that would otherwise
# be re-argued in review -- panics, stray printing, unsafe -- and stops there.
# Clippy's stylistic catalogue is not enabled: this project reviews numerical
# behaviour, and a lint queue full of idiom preferences competes for the same
# attention.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
# Library code reports through `tracing`; only the binary owns the console.
print_stdout = "deny"
print_stderr = "deny"
dbg_macro = "deny"
# A panic in library code is a bug. Analyses that cannot produce a number report
# it through the stage status contract instead (see alas-types).
unwrap_used = "deny"
expect_used = "deny"
todo = "warn"
unimplemented = "warn"

# Optimized builds are what gets benchmarked against the Python implementation,
# so the release profile is part of the measurement and belongs in the tree.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

# Parity tests replay full analyses; running them at opt-level 0 makes the suite
# slow enough that it stops being run.
[profile.test]
opt-level = 2
