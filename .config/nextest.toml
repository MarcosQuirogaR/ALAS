slow-timeout = { period = "120s", terminate-after = 30 }

[test-groups]
# Tests that spawn child processes and assert on wall-clock bounds (timeouts,
# cancellation, kill latency). Beside a full parallel run they miss their
# bounds, so at most two of them run at once.
wall-clock = { max-threads = 2 }

# Overrides in the default profile apply to every profile. The first override
# that matches a test sets each setting, so the narrower one comes first.
#
# Kill-latency tests with bounds of a few seconds: spawning and killing a
# process tree on Windows beside a full parallel run takes 5-10 s, so these run
# alone rather than having their bounds loosened.
[[profile.default.overrides]]
filter = "package(alas-exec) & test(/^openfoam::tests::(timeout|cancellation)_|^avl::avl_tests::(a_timeout_kills|cancellation_interrupts)|^process::tests::heavy_piped_output/)"
threads-required = "num-test-threads"
retries = 2

# Quick-analysis lifecycle checks await worker completion against fixed
# wall-clock deadlines, so competing numerical analyses must not starve them.
[[profile.default.overrides]]
filter = "package(alas-gui) & test(/^sandbox::quick::tests::(a_completed_job_terminates_every_metric_for_its_revision|a_superseded_job_never_repopulates_the_newer_revision|invalidation_marks_results_stale_without_discarding_them)$/)"
threads-required = "num-test-threads"

#
# Quarantine list: tests that depend on wall-clock time or machine load. They
# run in the wall-clock group and get two retries. Nextest reports every retry
# (FLAKY), so a test that needs one stays visible, and a test that fails all
# three attempts still fails. Remove an entry once the test stops depending on
# timing.
[[profile.default.overrides]]
filter = "(package(alas-exec) & test(/^(process|openfoam|supervise)::|^avl::avl_tests::/)) | (package(alas-aero) & (test(/^mses::exec::/) | binary(mses_dynamic_boundaries))) | (package(alas-opt) & test(/^cancellation::|native_pool::/)) | (package(alas-screen) & test(/^runner::/)) | (package(alas-gui) & test(/openvsp_runtime_setup|screening_readiness/))"
test-group = "wall-clock"
retries = 2

# Per-test wall times for `cargo xtask test-times` style reporting: the JUnit
# report of the full profile lists every test with its duration.
[profile.full.junit]
path = "junit.xml"
