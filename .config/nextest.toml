# cargo-nextest configuration. Install with `cargo install cargo-nextest --locked`.
#
# Tiers, selected by profile:
#   default      the fast dev-loop tier, run on every change (`cargo nextest run`)
#   medium       tests of 5 s or more that are not in the integration tier
#   integration  only the heavy tier (all-presets replays, acceptance, staged
#                searches), run at phase integration; `slow` is an alias
#   nightly      tests named `*_nightly` (the 16-worker staged-search replay)
#   full         default + medium + integration, run by CI and `cargo xtask gate`
# The five are disjoint except that `integration` also runs the nightly tests
# that live in its binaries; `cargo xtask gate --nightly` runs them alone.
#
# `cargo xtask test` runs nextest with the shared test-result store enabled
# (alas_testkit::memo), which lets tests that need the same nominal
# assessment share it across processes.
#
# Nextest does not run doctests. The repository checks reject runnable doc
# examples, so nothing is lost; use a unit test instead.

# The integration and medium filters are GENERATED from measured per-test times
# by `cargo xtask tiers <junit.xml> --write`, from the JUnit report of a
# `--profile full` run (`target/nextest/full/junit.xml`; the current lists come
# from the 2026-10-12 run of 5038 tests (3 threads, shared-store on) merged with the
# 2026-10-09 run of 4669 tests (16374 s summed on a loaded 16-thread
# host). Integration is every integration-test binary whose tests of 20 s or
# more add up to 60 s or more, plus every unit test of 40 s or more; medium is
# every other test of 5 s or more. The default profile excludes both and the
# nightly tests as `not (<integration> | <medium> | <nightly>)`, and a unit test
# in xtask fails if the profiles disagree. Nothing is skipped by the gate:
# `cargo xtask gate` runs the full profile, and CI runs the nightly tier too.
# Regenerate after large changes rather than editing the lists by hand.

[profile.default]
